defaults:
  patterns:
  - name: low_utilization_downsize
    description: Low utilization → downsize
    condition: cpu_avg < 5 AND mem_avg < 30
    action: downsize
    severity: high
  - name: idle_release
    description: Idle → release
    condition: cpu_avg < 2 AND (connections_avg < 5 OR connections IS NULL)
    action: release
    severity: high
  - name: paygo_long_running
    description: Pay-as-you-go running > 30 days → switch to reserved
    condition: charge_type IN (POSTPAID, POSTPAID_BY_HOUR) AND age_days >= 30
    action: switch_billing
    severity: critical
  - name: unattached_release
    description: Unattached resource → release
    condition: attached = false OR status = STOPPED
    action: release
    severity: critical
  - name: no_traffic_release
    description: No traffic/connections → confirm release
    condition: connections_avg < 1 AND bytes_avg < 100
    action: release
    severity: high
  metric_aliases:
    cpu:
    - CPUUseRate
    - CpuUseRate
    - CpuUsage
    - MonogdAvgCpuUsage
    - cpu_utilization
    mem:
    - MemoryUseRate
    - MemUsage
    - MemoryUsage
    - mem_utilization
    connections:
    - ConnectionUseRate
    - ClusterConn
    - ConnUsageRate
    - connections
    qps:
    - Qps
    - QPS
    - RequestsRate
    - request_rate
    bytes_in:
    - InTraffic
    - InBandwidth
    - NetInRate
    - bytes_in
    bytes_out:
    - OutTraffic
    - OutBandwidth
    - NetOutRate
    - bytes_out
    iops_read:
    - ReadIOPS
    - DiskReadIops
    iops_write:
    - WriteIOPS
    - DiskWriteIops
cvm:
  display_name: CVM 云服务器
  rid_field: InstanceId
  name_field: InstanceName
  spec_fields:
  - CPU
  - Memory
  spec_fn: cvm_spec
  charge_field: InstanceChargeType
  charge_mapping:
    POSTPAID_BY_HOUR: POSTPAID
    PREPAID: PREPAID
  metrics:
    cpu: CPUUseRate
    mem: MemUsage
  rules:
  - name: stopped_paygo
    condition: state = STOPPED AND charge = POSTPAID
    action: release
    severity: critical
    suggestion_stop_charging: 创建快照备份后释放实例（仅磁盘继续计费，如不再使用请释放）
    suggestion_keep_charging: 切换为关机不计费模式，或创建快照备份后释放实例
    target_spec: 释放实例(创建快照备份)
    optimize_path: 释放
  - name: idle
    condition: cpu_avg < 2 AND mem_avg < 5
    action: release
    severity: high
    suggestion: 疑似闲置，建议评审后释放
    target_spec: 释放实例(创建快照备份)
    optimize_path: 释放
  - name: low_utilization
    condition: cpu_avg < 10 AND mem_avg < 20
    action: downsize
    severity: high
    suggestion: 低利用率，建议降配
    optimize_path: 降配
  - name: paygo_long_running
    condition: charge = POSTPAID AND age_days >= 30
    action: switch_billing
    severity: critical
    suggestion: 转包年包月（正常使用中）
    target_spec: 转包年包月
    optimize_path: 计费优化
  - name: nonprod_schedulable
    condition: cpu_avg < 15 AND env = nonprod
    action: schedule_stop
    severity: medium
    suggestion: 非生产环境可定时关机
    optimize_path: 定时关机
  spec_tiers:
  - - 1
    - 1
  - - 1
    - 2
  - - 2
    - 2
  - - 2
    - 4
  - - 4
    - 4
  - - 4
    - 8
  - - 8
    - 8
  - - 8
    - 16
  - - 16
    - 32
  - - 32
    - 64
