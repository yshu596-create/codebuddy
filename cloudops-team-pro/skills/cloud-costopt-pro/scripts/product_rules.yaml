clb:
  display_name: CLB 负载均衡
  rid_field: LoadBalancerId
  name_field: LoadBalancerName
  spec_fields: []
  spec_fn: clb_spec
  rules:
  - name: no_listener
    condition: listeners_count = 0
    action: release
    severity: critical
    suggestion: 无监听器，建议释放
    target_spec: 释放实例
    optimize_path: 释放
  - name: no_backend
    condition: backends_count = 0
    action: release
    severity: critical
    suggestion: 无后端绑定，建议释放
    target_spec: 释放实例
    optimize_path: 释放
  - name: low_connections
    condition: connections_avg < 1 AND backends_count > 0
    action: confirm_stop
    severity: high
    suggestion: 有后端但无连接，确认是否停用
    optimize_path: 确认停用
